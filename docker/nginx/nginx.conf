# O SSL termina no Traefik (Coolify). O nginx escuta em 80 e encaminha para o Django pelo nome do serviço.
upstream django {
    server backend:8000 max_fails=3 fail_timeout=5s;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Django: API (sem retirar o prefixo /api), admin, dashboard do crawl e estáticos (whitenoise).
    location ~ ^/(api|admin|dashboard|static)/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # O Traefik já envia X-Forwarded-Proto=https; mantê-lo para o Django saber que o pedido é seguro.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 180s;
    }

    # SPA: ficheiros com hash em cache longa; o resto cai no index.html.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
